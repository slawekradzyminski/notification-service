# Postgres schema "notification" in the shared database; backend in the Compose network.
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD override the defaults below.
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/testdb?currentSchema=notification
    username: postgres
    password: postgres

backend:
  base-url: ${BACKEND_BASE_URL:http://backend:4001}

notification:
  # Required: the backend disables the notification caller when its token is unset.
  service-token: ${NOTIFICATION_SERVICE_TOKEN}

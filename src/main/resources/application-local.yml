# Local run next to the backend's local profile: the same PostgreSQL database
# (localhost:5432/testdb, schema "notification"):
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Override with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb?currentSchema=notification
    username: postgres
    password: postgres
  artemis:
    broker-url: tcp://localhost:61616

backend:
  base-url: ${BACKEND_BASE_URL:http://localhost:4001}

notification:
  service-token: ${NOTIFICATION_SERVICE_TOKEN:local-notification-token}
